<title>景點照片挑選</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@900&display=swap">
<style>
:root{--bg:#F4F5F1;--surface:#FFF;--ink:#1C2420;--muted:#65706A;--line:#DDE2DC;--accent:#0E7C66;--accent-soft:#E1F0EB;--wiki:#1F7A4C;--geo:#6B7280;--none:#A6700F;--none-soft:#FBF0DA;--shade:rgba(10,14,12,.86);}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#111513;--surface:#191F1C;--ink:#E3E9E5;--muted:#96A29B;--line:#2A322E;--accent:#4FC3A1;--accent-soft:#1B3029;--wiki:#58C28B;--geo:#9CA3AF;--none:#E3B04F;--none-soft:#33291A;--shade:rgba(0,0,0,.9);}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#111513;--surface:#191F1C;--ink:#E3E9E5;--muted:#96A29B;--line:#2A322E;--accent:#4FC3A1;--accent-soft:#1B3029;--wiki:#58C28B;--geo:#9CA3AF;--none:#E3B04F;--none-soft:#33291A;--shade:rgba(0,0,0,.9);}
body{background:var(--bg);color:var(--ink);font:15px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;padding-inline:16px;padding-block:24px 80px}
.wrap{max-width:760px;margin:0 auto;display:grid;gap:14px}
h1{font:900 28px/1.2 "Noto Serif TC","Songti TC",serif;margin:0}
p{margin:0;max-width:66ch}.muted{color:var(--muted)}
.note{font-size:13px;border-left:3px solid var(--line);padding-left:12px}
.stat{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px;font-size:14px}
.stat b{font-size:19px;font-variant-numeric:tabular-nums;margin-right:2px}
#save{margin-left:auto;font-size:13px;color:var(--muted)}#save.err{color:#B8433A}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{all:unset;cursor:pointer;font-size:13px;padding:4px 11px;border:1px solid var(--line);border-radius:999px;background:var(--surface);white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.done:not(.on){color:var(--muted)}
.chip:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lbl{font-size:12px;color:var(--muted);letter-spacing:.04em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px}
.card.skip{background:var(--none-soft)}
.ch{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.ch h3{font-size:17px;margin:0}
.ch .g{font-size:12px;color:var(--muted)}
.ch .st{margin-left:auto;font-size:12.5px;color:var(--muted)}
.card.picked .ch .st{color:var(--accent)}.card.skip .ch .st{color:var(--none)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.ph{position:relative;border-radius:7px;overflow:hidden;background:var(--line);aspect-ratio:4/3}
.ph button.pick{all:unset;display:block;width:100%;height:100%;cursor:pointer}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .src{position:absolute;left:4px;top:4px;font-size:10.5px;line-height:1;padding:3px 5px;border-radius:4px;color:#fff;background:var(--geo);pointer-events:none}
.ph .src.wiki{background:var(--wiki)}
.ph .zoom{all:unset;position:absolute;right:3px;bottom:3px;width:28px;height:28px;border-radius:6px;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;cursor:pointer}
.ph.on{outline:3px solid var(--accent);outline-offset:-3px}
.ph.on::after{content:"✓";position:absolute;right:4px;top:3px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--bg);font:700 14px/22px sans-serif;text-align:center;pointer-events:none}
.card.skip .ph{opacity:.45}
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{all:unset;cursor:pointer;font-size:13.5px;padding:6px 14px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.btn.on{border-color:var(--none);color:var(--none);font-weight:500}
.warn{font-size:12.5px;color:var(--none)}
.empty{font-size:13.5px;color:var(--muted)}
/* ⚠️ display:grid 會蓋掉 [hidden] 的 display:none（CLAUDE.md 所說的「[hidden] 藏不掉」），藏起來時這層遮罩會整片擋住點擊 */
[hidden]{display:none!important}
#box{position:fixed;inset:0;background:var(--shade);display:grid;place-items:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));z-index:10}
#box figure{margin:0;max-width:640px;width:100%;display:grid;gap:8px;color:#EEE;font-size:13px}
#box img{width:100%;border-radius:8px}
#box .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#box .btn{background:#222;border-color:#555;color:#EEE}
#box a{color:#9FD9C6}
</style>
<div class="wrap">
<header style="display:grid;gap:8px">
  <h1>景點照片挑選</h1>
  <p id="intro">載入中…</p>
  <p class="muted" style="font-size:13.5px">點照片就選好了，會自動存起來；點另一張就換。都不喜歡就按「都不要」（之後有新照片會再出現）。右下角的放大鏡可以看大一點。
    <span style="color:var(--wiki)">綠色「維基」</span>＝用名字找到的，通常就是這個地方；<span style="color:var(--geo)">灰色「附近」</span>＝座標附近拍到的，可能拍到隔壁。</p>
  <p class="note muted" id="mode">正在連線…</p>
</header>
<div class="stat"><span><b id="nTodo">–</b>筆還沒挑</span><span><b id="nDone">–</b>筆挑好了</span><span id="save"></span></div>
<div style="display:grid;gap:6px">
  <span class="lbl">顯示</span>
  <div class="chips" id="views">
    <button class="chip on" data-v="todo" type="button">要你挑的</button>
    <button class="chip" data-v="sug" type="button">先幫你選的</button>
    <button class="chip" data-v="all" type="button">全部</button>
  </div>
  <span class="lbl">地區</span>
  <div class="chips" id="areas"></div>
</div>
<main id="main" style="display:grid;gap:10px"></main>
</div>
<div id="box" hidden></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LS="twph_v1",CID=Math.random().toString(36).slice(2);
let IDX=[],AREA={},cur=null,view="todo",db=null,dbOK=false;
// E[區][景點 id] = 檔名（選了）｜"-"（都不要）｜""（取消了建議、還沒選）；沒有這個鍵＝沒動過（有建議就用建議）
let E={};try{E=JSON.parse(localStorage.getItem(LS)||"{}")||{};}catch(e){E={};}
const saveLocal=()=>{try{localStorage.setItem(LS,JSON.stringify(E));}catch(e){}};
const lastLocal={},writing={},dirty={};
const val=(k,p)=>{const e=E[k]||{};return p.id in e?e[p.id]:(p.sug||undefined);};
const isTodo=p=>p.c.length&&!p.sug;
function counts(){let todo=0,done=0;
  for(const a of IDX){const e=E[a.k]||{};
    for(const id of a.todoIds){const v=e[id];if(v&&v!=="")done++;else todo++;}}
  $("#nTodo").textContent=todo;$("#nDone").textContent=done;
  for(const a of IDX){const e=E[a.k]||{};const left=a.todoIds.filter(id=>!e[id]).length;
    const b=document.querySelector(`#areas .chip[data-k="${a.k}"]`);if(!b)continue;
    b.textContent=`${a.area} ${left?left:"✓"}`;b.classList.toggle("done",!left);}
}
function cardHTML(k,p){
  const v=val(k,p),skip=v==="-",picked=v&&v!=="-";
  const st=!p.c.length?"":skip?"都不要":picked?(p.sug&&v===p.sug&&!((E[k]||{})[p.id])?"先幫你選的":"選好了"):"還沒選";
  const warn=p.c.some(c=>c.s==="wiki"&&c.n.includes("⚠"))?`<p class="warn">維基條目的座標離這裡有點遠（${esc((p.c.find(c=>c.n.includes("⚠"))||{}).n.split("⚠")[1])}），確認一下拍的是不是這裡</p>`:"";
  const body=p.c.length?`<div class="grid">${p.c.map((c,i)=>`<div class="ph ${v===c.f?"on":""}"><button class="pick" type="button" data-i="${i}" aria-label="選第 ${i+1} 張"><img src="${c.i}" alt="" loading="lazy"></button><span class="src ${c.s==="wiki"?"wiki":""}">${c.s==="wiki"?"維基":"附近"}</span><button class="zoom" type="button" data-z="${i}" aria-label="放大第 ${i+1} 張"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10" cy="10" r="6.5"/><path d="M15 15l5.5 5.5M7.5 10h5M10 7.5v5"/></svg></button></div>`).join("")}</div>${warn}
    <div class="acts"><button class="btn ${skip?"on":""}" type="button" data-skip>都不要</button></div>`
    :`<p class="empty">維基與附近都找不到照片，網站上會用分類圖示代替。</p>`;
  return `<article class="card ${picked?"picked":""} ${skip?"skip":""}" data-id="${esc(p.id)}"><div class="ch"><h3>${esc(p.t)}</h3><span class="g">${esc(p.g)}</span><span class="st">${st}</span></div>${body}</article>`;
}
function render(){
  const main=$("#main");
  if(!cur){main.innerHTML='<p class="muted">選一個地區。</p>';return;}
  const d=AREA[cur];if(!d){main.innerHTML='<p class="muted">載入照片中…（一個地區約 1～3 MB）</p>';return;}
  const list=d.places.filter(p=>view==="all"||(view==="sug"?!!p.sug:isTodo(p)));
  main.innerHTML=list.length?list.map(p=>cardHTML(cur,p)).join(""):`<p class="muted">${view==="sug"?"這個地區沒有先幫你選的。":view==="todo"?"這個地區不用你挑（都先幫你選好了），可以到「先幫你選的」看看。":"沒有景點。"}</p>`;
}
function redrawCard(id){const d=AREA[cur];const p=d&&d.places.find(x=>x.id===id);const el=document.querySelector(`.card[data-id="${CSS.escape(id)}"]`);
  if(p&&el)el.outerHTML=cardHTML(cur,p);}
async function openArea(k){
  cur=k;document.querySelectorAll("#areas .chip").forEach(x=>x.classList.toggle("on",x.dataset.k===k));
  try{localStorage.setItem(LS+"_area",k);}catch(e){}
  render();
  if(!AREA[k]){try{AREA[k]=await (await fetch("data/"+k+".json")).json();}catch(e){$("#main").innerHTML='<p class="muted">這個地區的照片載入失敗，請再點一次地區。</p>';return;}
    if(cur===k)render();}
}
function setV(id,v){const k=cur;E[k]=E[k]||{};E[k][id]=v;lastLocal[k]=Date.now();saveLocal();redrawCard(id);counts();flush(k);}
document.addEventListener("click",e=>{
  const vb=e.target.closest("#views .chip");if(vb){view=vb.dataset.v;document.querySelectorAll("#views .chip").forEach(x=>x.classList.toggle("on",x===vb));render();return;}
  const ab=e.target.closest("#areas .chip");if(ab){openArea(ab.dataset.k);return;}
  const card=e.target.closest(".card");const d=AREA[cur];if(!card||!d)return;
  const p=d.places.find(x=>x.id===card.dataset.id);if(!p)return;
  const pk=e.target.closest("button.pick");
  if(pk){const f=p.c[+pk.dataset.i].f;setV(p.id,val(cur,p)===f?"":f);return;}
  if(e.target.closest("[data-skip]")){setV(p.id,val(cur,p)==="-"?"":"-");return;}
  const z=e.target.closest("button.zoom");if(z)zoom(p,+z.dataset.z);
});
function zoom(p,i){const c=p.c[i],box=$("#box");
  box.innerHTML=`<figure><img src="${c.i}" alt=""><figcaption>${esc(p.t)}｜${c.s==="wiki"?"維基":"附近"}｜${esc(c.lic)}｜${esc(c.by)}</figcaption>
    <div class="row"><button class="btn" type="button" data-bpick>選這張</button><button class="btn" type="button" data-bclose>關閉</button>${c.u?`<a href="${esc(c.u)}" target="_blank" rel="noopener">在維基共享資源看原圖 ↗</a>`:""}</div></figure>`;
  box.hidden=false;
  box.onclick=ev=>{if(ev.target.closest("[data-bpick]")){box.hidden=true;setV(p.id,c.f);return;}
    if(ev.target===box||ev.target.closest("[data-bclose]"))box.hidden=true;};
}
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#box").hidden=true;});
function setSave(t,err){const el=$("#save");el.textContent=t;el.className=err?"err":"";}
async function flush(k){if(!dbOK)return;if(writing[k]){dirty[k]=true;return;}writing[k]=true;setSave("儲存中…");
  try{do{dirty[k]=false;await db.doc("pick/"+k).set({p:E[k]||{},at:new Date().toISOString(),cid:CID});}while(dirty[k]);setSave("已儲存");}
  catch(e){setSave("儲存失敗，請再點一次",true);}finally{writing[k]=false;}}
fetch("data/index.json").then(r=>r.json()).then(ix=>{
  IDX=ix;
  const sug=ix.reduce((s,a)=>s+a.sug,0),pick=ix.reduce((s,a)=>s+a.pick,0),none=ix.reduce((s,a)=>s+a.none,0);
  $("#intro").innerHTML=`<b>要你挑的有 ${pick} 筆。</b>另外 ${sug} 筆有維基條目的代表照片，我先幫你選好了（在「先幫你選的」可以換）；${none} 筆找不到照片，網站上會用分類圖示。`;
  $("#areas").innerHTML=ix.map(a=>`<button class="chip" type="button" data-k="${a.k}">${esc(a.area)}</button>`).join("");
  counts();
  let k0=null;try{k0=localStorage.getItem(LS+"_area");}catch(e){}
  if(!ix.some(a=>a.k===k0))k0=(ix.find(a=>a.pick)||ix[0]).k;
  openArea(k0);connect();
}).catch(()=>{$("#intro").textContent="資料載入失敗，請重新整理。";});
async function connect(){
  try{db=window.claude&&await window.claude.use("db");}catch(e){db=null;}
  if(!db){$("#mode").textContent="這個畫面連不到儲存空間，你挑的只會記在這台裝置上。挑完請告訴我一聲。";return;}
  dbOK=true;$("#mode").textContent="已連線：每點一下就存起來，下次打開接著挑。";
  // ⚠️ 自己寫的回聲（cid 相同）、正在寫的、本機 10 秒內改過的區一律不理——通知可能亂序（CLAUDE.md 地雷 21）
  db.collection("pick").onSnapshot(snap=>{let ch=[];
    for(const d of snap.docs){const b=d.data()||{};if(writing[d.id]||b.cid===CID||Date.now()-(lastLocal[d.id]||0)<10000)continue;
      if(JSON.stringify(b.p||{})!==JSON.stringify(E[d.id]||{})){E[d.id]=b.p||{};ch.push(d.id);}}
    if(ch.length){saveLocal();counts();if(ch.includes(cur)&&$("#box").hidden)render();}},
    ()=>{dbOK=false;$("#mode").textContent="連線中斷：接下來挑的只記在這台裝置上，重新整理可以再連。";});
}
</script>
